services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ainews
      POSTGRES_PASSWORD: ainews_dev
      POSTGRES_DB: ainews
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainews"]
      interval: 5s
      retries: 10
volumes:
  dbdata:
